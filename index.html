    <!-- Favicon -->

    <link rel="icon" type="image/png" sizes="16x16" href="/logo.png" />

    <!-- SEO -->

    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.koda-ye.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KodaSoft" />
    <meta property="og:url" content="https://www.koda-ye.com/" />
    <meta property="og:title" content="KodaSoft — Software That Moves Your Business Forward" />
    <meta
      property="og:description"
      content="Websites, digital stores, and modern business systems — built for reliable performance, great user experience, and scale as your business grows."
    />
    <meta property="og:image" content="https://www.koda-ye.com/logo.jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="KodaSoft — Software That Moves Your Business Forward" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KodaSoft — Software That Moves Your Business Forward" />
    <meta
      name="twitter:description"
      content="Websites, digital stores, and modern business systems — built for reliable performance, great user experience, and scale as your business grows."
    />
    <meta name="twitter:image" content="https://www.koda-ye.com/logo.jpeg" />
    <meta name="twitter:image:alt" content="KodaSoft — Software That Moves Your Business Forward" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "KodaSoft",
        "url": "https://www.koda-ye.com",
        "logo": "https://www.koda-ye.com/logo.jpeg",
        "description": "KodaSoft builds software that moves your business forward — websites, digital stores, and modern business systems with reliable performance, great UX, and room to grow.",
        "email": "kodasoft.dev@gmail.com",
        "sameAs": [],
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "YE"
        },
        "areaServed": {
          "@type": "Country",
          "name": "Yemen"
        },
        "knowsLanguage": ["en", "ar"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "KodaSoft",
        "url": "https://www.koda-ye.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.koda-ye.com/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Theme (prevent FOUC) -->
    <script>
      (function () {
        var t = localStorage.getItem("kodasoft-theme");
        if (!t) t = "dark";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
